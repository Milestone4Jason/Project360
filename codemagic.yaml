workflows:
  project360-android:
    name: Project360 Xbox 360 Emulator (ARM64)
    instance_type: linux_x2
    max_build_duration: 120
    environment:
      ubuntu: 24.04
      java: 21
      ndk: 29.0.14206865
    scripts:
      - name: Install native build tools
        script: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 glslang-tools spirv-tools ccache
      - name: Install Android SDK components
        script: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.30.3"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$CM_ENV"
      - name: Fetch pinned Xendroid+ emulator source
        script: |
          git clone https://github.com/phforner0/Xendroid-Plus.git xendroid-plus
          git -C xendroid-plus checkout f8fa3066e2930725fd25d82deabd255434552922
      - name: Configure Android SDK paths
        script: |
          cd xendroid-plus
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          printf 'cmake.dir=%s/cmake/3.30.3\n' "$ANDROID_SDK_ROOT" >> local.properties
      - name: Brand app as Project360 and retain upstream credits
        script: |
          sed -i 's#<string name="app_name">Xendroid+</string>#<string name="app_name">Project360 (Xendroid+ core)</string>#' \
            xendroid-plus/app/src/main/res/values/strings.xml
      - name: Build ARM64 Android APK
        script: |
          cd xendroid-plus
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            :app:assembleDebug
    artifacts:
      - xendroid-plus/app/build/outputs/apk/debug/*.apk
