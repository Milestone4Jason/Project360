name: Build Project360 Xbox 360 Emulator
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      ANDROID_NDK_VERSION: 29.0.14206865
      CMAKE_VERSION: 3.30.3
      BUILD_TOOLS_VERSION: 35.0.0
      XENDROID_COMMIT: f8fa3066e2930725fd25d82deabd255434552922
    steps:
      - name: Checkout Project360
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 glslang-tools spirv-tools ccache

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;29.0.14206865" "cmake;3.30.3"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Fetch Xendroid+ Xbox 360 emulator core
        run: |
          git clone https://github.com/phforner0/Xendroid-Plus.git xendroid-plus
          git -C xendroid-plus checkout "$XENDROID_COMMIT"
          echo "Using Xendroid+ source commit: $XENDROID_COMMIT"

      - name: Configure Android SDK paths
        run: |
          cd xendroid-plus
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'cmake.dir=%s/cmake/3.30.3\n' "$ANDROID_HOME" >> local.properties

      - name: Brand app as Project360 and retain upstream credits
        run: |
          sed -i 's#<string name="app_name">Xendroid+</string>#<string name="app_name">Project360 (Xendroid+ core)</string>#' \
            xendroid-plus/app/src/main/res/values/strings.xml

      - name: Build Xbox 360 emulator APK
        working-directory: xendroid-plus
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            :app:assembleDebug

      - name: Upload Project360 emulator APK
        uses: actions/upload-artifact@v4
        with:
          name: Project360-Xbox360-emulator-arm64
          path: xendroid-plus/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Build information
        run: |
          {
            echo "## Project360 Xbox 360 emulator build"
            echo "- Emulator engine: Xendroid+ / Xenia"
            echo "- Upstream source commit: [$XENDROID_COMMIT](https://github.com/phforner0/Xendroid-Plus/commit/$XENDROID_COMMIT)"
            echo "- Architecture: arm64-v8a"
            echo "- Games, firmware and keys are not included."
            echo "- The emulator is experimental; device compatibility is not guaranteed."
          } >> "$GITHUB_STEP_SUMMARY"
